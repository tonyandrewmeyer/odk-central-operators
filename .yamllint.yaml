extends: default

ignore: |
  hack/upstream/
  charms/*/lib/
  .venv/

rules:
  line-length:
    max: 120
    level: warning
  document-start: disable
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
  braces:
    max-spaces-inside: 1
  indentation:
    spaces: consistent
    indent-sequences: consistent
