default_language_version:
  python: python3.12

exclude: '^(hack/upstream/|charms/[^/]+/lib/|LICENSE$)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yaml]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict (per charm)
        entry: uv run python scripts/typecheck.py
        language: system
        pass_filenames: false
        types_or: [python, toml]

      - id: sync-libs
        name: Charm library copies match lib/
        entry: uv run python scripts/sync-libs.py
        language: system
        pass_filenames: false
        files: '^(lib/|charms/[^/]+/lib/charms/(odk_central_k8s|pyxform_k8s)/)'

      - id: export-requirements
        name: Charm requirements match uv.lock
        entry: uv run python scripts/export-requirements.py
        language: system
        pass_filenames: false
        files: '^(uv\.lock|pyproject\.toml|charms/[^/]+/(pyproject\.toml|requirements\.txt))$'

      - id: check-docs
        name: Config docs match charmcraft.yaml
        entry: uv run python scripts/check-docs.py
        language: system
        pass_filenames: false
        files: '^(charms/[^/]+/charmcraft\.yaml|docs/configuration\.md|scripts/check-docs\.py)$'
