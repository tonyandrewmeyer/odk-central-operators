name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  unit-tests:
    name: Unit tests (${{ matrix.charm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        charm: [odk-central-k8s, enketo-k8s, pyxform-k8s]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      # Each charm is run on its own: all three have a src/charm.py, and a
      # single invocation over the repository sees three modules named `charm`
      # and refuses to collect.
      - name: Run unit tests
        run: >-
          uv run pytest charms/${{ matrix.charm }}/tests/unit -v
          --cov=charm --cov-branch --cov-report=term-missing --cov-fail-under=95

  docs-check:
    name: Docs match charmcraft.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - name: Check generated config tables
        run: uv run python scripts/check-docs.py
      - name: Build the docs site
        run: uv run mkdocs build --strict

  pack:
    name: Pack (${{ matrix.charm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        charm: [odk-central-k8s, enketo-k8s, pyxform-k8s]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee  # v1
      - name: Install charmcraft
        run: sudo snap install charmcraft --classic --channel latest/stable
      - name: Pack the charm
        run: charmcraft pack --verbosity=brief
        working-directory: charms/${{ matrix.charm }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ matrix.charm }}-charm
          path: charms/${{ matrix.charm }}/*.charm
          if-no-files-found: error

  integration-tests:
    name: Integration tests
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [unit-tests, pack]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee  # v1
      - uses: charmed-kubernetes/actions-operator@d8217ad61c15f746727a9d41563c13e9b9fe56e3  # main
        with:
          provider: microk8s
          channel: 1.32-strict/stable
          juju-channel: 3.6/stable
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: '*-charm'
          path: packed
      - name: Run the group integration suite
        run: uv run pytest tests/integration -v --log-cli-level=INFO
        env:
          CHARM_ARTIFACT_DIR: ${{ github.workspace }}/packed
