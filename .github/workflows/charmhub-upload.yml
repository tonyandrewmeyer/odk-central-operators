name: Charmhub upload

on:
  push:
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    name: Upload ${{ matrix.charm }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        charm: [odk-central-k8s, enketo-k8s, pyxform-k8s]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee  # v1

      - name: Install charmcraft
        run: sudo snap install charmcraft --classic --channel latest/stable

      - name: Pack the charm
        run: charmcraft pack --verbosity=brief
        working-directory: charms/${{ matrix.charm }}

      # Upload only. The three charms are version-locked to each other and to
      # one upstream ODK Central release, so releasing to a channel is a
      # deliberate act performed for all three together -- see RELEASE.md.
      # Uncommenting `--release` here is how this group gets broken.
      - name: Upload to Charmhub
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMHUB_TOKEN }}
        run: charmcraft upload ${{ matrix.charm }}_amd64.charm
        working-directory: charms/${{ matrix.charm }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.charm }}-${{ github.ref_name }}
          path: charms/${{ matrix.charm }}/*.charm
          if-no-files-found: error
