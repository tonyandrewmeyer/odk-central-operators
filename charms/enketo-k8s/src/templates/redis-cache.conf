# Derived from getodk/central files/enketo/redis-enketo-cache.conf at v2026.2.4.
#
# Changes from upstream:
#
#   1. Snapshotting is switched off (`save ""`). This instance is a cache of
#      transformed forms and has no Juju storage attached, so upstream's
#      `save 3600 1` would write a dump file to an ephemeral overlay that
#      cannot survive a restart anyway. Losing the cache costs one
#      re-transformation per form.
#   2. The charm appends a `maxmemory` line and its eviction policy.
#
# The port stays 6380: Enketo's own default config expects the cache there,
# and moving it breaks nothing visibly until cache lookups start failing.

# Redis configuration for Enketo's XSLT Cache

#supervised systemd

#daemonize yes

#pidfile /var/run/redis-enketo-cache/redis-server.pid

port 6380

bind 0.0.0.0

timeout 0

tcp-keepalive 0

loglevel notice

#logfile /var/log/redis/redis-enketo-cache.log

databases 16

save ""

stop-writes-on-bgsave-error yes

rdbcompression yes

rdbchecksum yes

dbfilename enketo-cache.rdb

dir /data

slave-serve-stale-data yes
slave-read-only yes
repl-disable-tcp-nodelay no
slave-priority 100

appendonly no

lua-time-limit 5000

slowlog-log-slower-than 10000

slowlog-max-len 128

notify-keyspace-events ""

hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-entries 512
list-max-ziplist-value 64
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
activerehashing yes
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit slave 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60
hz 10
aof-rewrite-incremental-fsync yes

#include /etc/redis/conf.d/local.conf
