# Derived from getodk/central files/enketo/redis-enketo-main.conf at v2026.2.4.
#
# Two changes from upstream, both because Juju storage is mounted rather than a
# Docker anonymous volume:
#
#   1. `dir /data` is set explicitly. Upstream leaves it commented out and
#      relies on the container's working directory; under Pebble the working
#      directory is not guaranteed, and the dump has to land on the Juju
#      filesystem storage or it is lost on every restart.
#   2. The charm appends a `maxmemory` line when one is configured.
#
# This is the durable instance. It holds Enketo's in-flight form and instance
# state and is the only state in the ODK Central charm group that is not in
# PostgreSQL or the S3 blob store.

# Redis configuration for Enketo's main database instance

#supervised systemd

#daemonize yes

#pidfile /var/run/redis-enketo-cache/redis-server.pid

port 6379

bind 0.0.0.0

timeout 0

tcp-keepalive 0

loglevel notice

#logfile /var/log/redis/redis-enketo-main.log

databases 16

save 300 1

stop-writes-on-bgsave-error yes

rdbcompression yes

rdbchecksum yes

dbfilename enketo-main.rdb

dir /data

slave-serve-stale-data yes
slave-read-only yes
repl-disable-tcp-nodelay no
slave-priority 100

appendonly no

lua-time-limit 5000

slowlog-log-slower-than 10000

slowlog-max-len 128

notify-keyspace-events ""

hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-entries 512
list-max-ziplist-value 64
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
activerehashing yes
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit slave 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60
hz 10
aof-rewrite-incremental-fsync yes

#include /etc/redis/conf.d/local.conf
