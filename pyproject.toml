[project]
name = "odk-central-operators"
version = "0.1.0"
description = "Juju charms for ODK Central, Enketo and pyxform"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ops[testing]>=3.0,<4.0",
    "jubilant>=1.0,<2.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "requests>=2.32",
    "mypy>=1.13",
    "ruff>=0.8",
    "pre-commit>=4.0",
    "types-requests",
    "types-PyYAML",
    "PyYAML>=6.0",
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5",
]

[tool.uv.workspace]
members = ["charms/*"]

[tool.ruff]
line-length = 99
target-version = "py312"
extend-exclude = ["charms/*/lib", "hack/upstream"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN"]
"conftest.py" = ["ANN"]

[tool.mypy]
strict = true
python_version = "3.12"
exclude = ["charms/[^/]+/lib/", "hack/"]
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["charms.*"]
ignore_missing_imports = true
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra"
